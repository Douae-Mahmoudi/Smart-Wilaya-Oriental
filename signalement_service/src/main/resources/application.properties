spring.application.name=signalement-service
server.port=7057
spring.datasource.url=jdbc:postgresql://localhost:5435/signalement_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:7080/realms/wilaya-interventions

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.upload.dir=uploads/signalements
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
































